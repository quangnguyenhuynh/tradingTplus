name: TradingTPlus Stock EOD Pipeline

on:
  schedule:
    # 16:30 Vietnam time (UTC+7) on weekdays = 09:30 UTC Monday-Friday.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date in DD/MM/YYYY format"
        required: false
        type: string
      symbols:
        description: "Optional space-separated daily-active stock symbols"
        required: false
        type: string
      data_source:
        description: "Stock daily source (auto uses the newest ready source)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - ssi_v3
          - ssi_v2

concurrency:
  group: tradingtplus-stock-eod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-eod:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
      SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Daily EOD pipeline
        run: |
          cmd=(python main.py stock-eod)
          if [ -n "${{ inputs.date }}" ]; then
            cmd+=("${{ inputs.date }}")
          fi
          if [ -n "${{ inputs.symbols }}" ]; then
            read -r -a symbols <<< "${{ inputs.symbols }}"
            cmd+=(--symbols "${symbols[@]}")
          fi
          if [ -n "${{ inputs.data_source }}" ] && [ "${{ inputs.data_source }}" != "auto" ]; then
            cmd+=(--data-source "${{ inputs.data_source }}")
          fi
          "${cmd[@]}"
