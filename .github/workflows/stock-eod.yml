name: TradingTPlus Stock EOD Pipeline

on:
  schedule:
    # 16:30 Vietnam time (UTC+7) on weekdays = 09:30 UTC Monday-Friday.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date in DD/MM/YYYY format"
        required: false
        type: string
      symbols:
        description: "Optional space-separated daily-active stock symbols"
        required: false
        type: string
      data_source:
        description: "Stock daily source (auto uses the newest ready source)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - ssi_v3
          - ssi_v2

concurrency:
  group: tradingtplus-stock-eod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-eod:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
      SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      DATE_INPUT: ${{ inputs.date }}
      SYMBOLS_INPUT: ${{ inputs.symbols }}
      DATA_SOURCE_INPUT: ${{ inputs.data_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Stock EOD target date
        id: resolve-date
        shell: bash
        run: |
          python -m src.pipeline.workflow_dates stock \
            --event "${{ github.event_name }}" \
            --manual-date "$DATE_INPUT" | tee -a "$GITHUB_OUTPUT"

      - name: Run Stock Daily EOD pipeline
        env:
          TARGET_DATE: ${{ steps.resolve-date.outputs.target_date }}
        run: |
          echo "event=${{ github.event_name }}"
          echo "runtime_vn=${{ steps.resolve-date.outputs.runtime_vn }}"
          echo "target_date=$TARGET_DATE"
          echo "target_source=${{ steps.resolve-date.outputs.target_source }}"
          cmd=(python main.py stock-eod "$TARGET_DATE")
          if [ -n "$SYMBOLS_INPUT" ]; then
            read -r -a symbols <<< "$SYMBOLS_INPUT"
            cmd+=(--symbols "${symbols[@]}")
          fi
          if [ -n "$DATA_SOURCE_INPUT" ] && [ "$DATA_SOURCE_INPUT" != "auto" ]; then
            cmd+=(--data-source "$DATA_SOURCE_INPUT")
          fi
          "${cmd[@]}"
