name: TradingTPlus Index EOD Pipeline

on:
  schedule:
    # 08:30 Vietnam = 01:30 UTC Tuesday-Saturday.
    # Scheduled runs ingest the previous calendar day because SSI proprietary
    # trading totals are available the following morning.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date in YYYY-MM-DD or DD/MM/YYYY format"
        required: false
        type: string
      indexes:
        description: "Optional space-separated index codes; empty means active index_master rows"
        required: false
        type: string

concurrency:
  group: tradingtplus-index-eod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
      SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      DATE_INPUT: ${{ inputs.date }}
      INDEXES_INPUT: ${{ inputs.indexes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Index EOD target date
        id: resolve-date
        shell: bash
        run: |
          python -m src.pipeline.workflow_dates index \
            --event "${{ github.event_name }}" \
            --manual-date "$DATE_INPUT" | tee -a "$GITHUB_OUTPUT"

      - name: Run index EOD ingest
        shell: bash
        env:
          TARGET_DATE: ${{ steps.resolve-date.outputs.target_date }}
        run: |
          echo "event=${{ github.event_name }}"
          echo "runtime_vn=${{ steps.resolve-date.outputs.runtime_vn }}"
          echo "scheduled_slot_vn=${{ steps.resolve-date.outputs.scheduled_slot_vn }}"
          echo "target_date=$TARGET_DATE"
          echo "target_source=${{ steps.resolve-date.outputs.target_source }}"
          cmd=(python main.py index-daily "$TARGET_DATE")
          if [ -n "$INDEXES_INPUT" ]; then
            read -r -a indexes <<< "$INDEXES_INPUT"
            cmd+=(--indexes "${indexes[@]}")
          fi
          "${cmd[@]}"
