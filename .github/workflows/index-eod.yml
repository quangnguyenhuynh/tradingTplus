name: TradingTPlus Index EOD Pipeline

on:
  schedule:
    # 08:07 Vietnam time (UTC+7) Tuesday-Saturday = 01:07 UTC Tuesday-Saturday.
    # Scheduled runs ingest the previous calendar day because SSI proprietary
    # trading totals are available the following morning.
    - cron: "7 1 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date in YYYY-MM-DD or DD/MM/YYYY format"
        required: false
        type: string
      indexes:
        description: "Optional space-separated index codes; empty means active index_master rows"
        required: false
        type: string

concurrency:
  group: tradingtplus-index-eod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
      SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      DATE_INPUT: ${{ inputs.date }}
      INDEXES_INPUT: ${{ inputs.indexes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run index EOD ingest
        shell: bash
        run: |
          target_date="$DATE_INPUT"
          if [ -z "$target_date" ]; then
            target_date="$(TZ=Asia/Ho_Chi_Minh date -d 'yesterday' '+%d/%m/%Y')"
          fi

          echo "Index EOD target date: $target_date"
          cmd=(python main.py index-daily "$target_date")
          if [ -n "$INDEXES_INPUT" ]; then
            read -r -a indexes <<< "$INDEXES_INPUT"
            cmd+=(--indexes "${indexes[@]}")
          fi
          "${cmd[@]}"
