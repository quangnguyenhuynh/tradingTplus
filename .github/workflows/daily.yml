name: Run Python Daily

on:
  schedule:
    # 7h sáng VN mỗi ngày
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py daily
        run: python main.py daily