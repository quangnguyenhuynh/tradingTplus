name: TradingTPlus Stock Intraday Pipeline

on:
  schedule:
    # 17:00 Asia/Ho_Chi_Minh Monday-Friday.
    - cron: "0 17 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date in DD/MM/YYYY format"
        required: false
        type: string
      symbols:
        description: "Optional space-separated symbols; still intersected with effective intraday active scope"
        required: false
        type: string

concurrency:
  group: tradingtplus-stock-intraday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-intraday:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
      SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
      DATE_INPUT: ${{ inputs.date }}
      SYMBOLS_INPUT: ${{ inputs.symbols }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve Stock Intraday target date
        id: resolve-date
        shell: bash
        run: |
          python -m src.pipeline.workflow_dates stock-intraday \
            --event "${{ github.event_name }}" \
            --manual-date "$DATE_INPUT" | tee -a "$GITHUB_OUTPUT"
      - name: Run Stock Intraday 1m pipeline
        shell: bash
        env:
          TARGET_DATE: ${{ steps.resolve-date.outputs.target_date }}
        run: |
          echo "event=${{ github.event_name }}"
          echo "runtime_vn=${{ steps.resolve-date.outputs.runtime_vn }}"
          echo "scheduled_slot_vn=${{ steps.resolve-date.outputs.scheduled_slot_vn }}"
          echo "target_date=$TARGET_DATE"
          echo "target_source=${{ steps.resolve-date.outputs.target_source }}"
          cmd=(python main.py stock-intraday "$TARGET_DATE")
          if [ -n "$SYMBOLS_INPUT" ]; then
            read -r -a symbols <<< "$SYMBOLS_INPUT"
            cmd+=(--symbols "${symbols[@]}")
          fi
          "${cmd[@]}"
