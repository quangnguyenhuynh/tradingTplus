name: TradingTPlus Stock Intraday Pipeline

on:
  schedule:
    # 17:00 Vietnam time (UTC+7) on weekdays = 10:00 UTC Monday-Friday.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date in DD/MM/YYYY format"
        required: false
        type: string
      symbols:
        description: "Optional space-separated symbols; still intersected with effective intraday active scope"
        required: false
        type: string

concurrency:
  group: tradingtplus-stock-intraday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-intraday:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
      SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Stock Intraday 1m pipeline
        run: |
          cmd=(python main.py stock-intraday)
          if [ -n "${{ inputs.date }}" ]; then cmd+=("${{ inputs.date }}"); fi
          if [ -n "${{ inputs.symbols }}" ]; then
            read -r -a symbols <<< "${{ inputs.symbols }}"
            cmd+=(--symbols "${symbols[@]}")
          fi
          "${cmd[@]}"
